# Tag push (v0.0.1, v0.0.1-test, ...) builds the unsigned release of rsm for macOS, Windows and
# Linux through build-release.yml. A tag with a '-' in it becomes a pre-release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release rsm
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      app: rsm
      tag: ${{ github.ref_name }}
      binary: vectorcraft
